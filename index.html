<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHY 102 Question Bank</title>
<style>
:root{
  --paper:#f3f6fb; --sheet:#ffffff; --ink:#18244f; --mute:#5b6690; --rule:#d5def0;
  --margin:#e58b8d; --pen:#2b45b8; --pen-bg:#e6ecfb; --ok:#17703f; --ok-bg:#dff3e7;
  --bad:#a92b25; --bad-bg:#fbe5e3; --focus:#2b45b8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10141f; --sheet:#181e2d; --ink:#dfe6ff; --mute:#9aa6d0; --rule:#2a3350;
    --margin:#8a4a55; --pen:#8fa6ff; --pen-bg:#222c52; --ok:#6fd39a; --ok-bg:#153524;
    --bad:#ff9a92; --bad-bg:#3d1c1f; --focus:#8fa6ff;
  }
}
:root[data-theme="dark"]{
  --paper:#10141f; --sheet:#181e2d; --ink:#dfe6ff; --mute:#9aa6d0; --rule:#2a3350;
  --margin:#8a4a55; --pen:#8fa6ff; --pen-bg:#222c52; --ok:#6fd39a; --ok-bg:#153524;
  --bad:#ff9a92; --bad-bg:#3d1c1f; --focus:#8fa6ff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font:700 26px/1.2 Georgia,"Iowan Old Style","Times New Roman",serif;margin:8px 0 4px;letter-spacing:-.01em}
h2{font:600 16px/1.3 system-ui,sans-serif;margin:0 0 12px}
h3{font:700 18px/1.3 Georgia,serif;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--pen)}
.sub{margin:0 0 20px;color:var(--mute)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);
  background:transparent;color:var(--ink);cursor:pointer}
.chip span{color:var(--mute);margin-left:4px;font-size:12px}
.chip.on{background:var(--pen-bg);border-color:var(--pen);color:var(--pen)}
.chip.on span{color:var(--pen)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.mute{color:var(--mute);font-size:14px;margin:12px 0 0}
.btn{font:inherit;font-weight:600;padding:11px 18px;border-radius:8px;border:1px solid var(--pen);
  background:var(--pen);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn{color:#10141f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#10141f}}
.btn.ghost{background:transparent;color:var(--pen)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{font:inherit;font-size:14px;background:none;border:0;color:var(--pen);cursor:pointer;padding:4px 2px;text-decoration:underline}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* exercise-book page */
.page{position:relative;background:
  repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px),var(--sheet);
  border:1px solid var(--rule);border-radius:10px;padding:14px 16px 16px 44px;margin-bottom:14px}
.page::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.7}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-bottom:6px;flex-wrap:wrap}
.bar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pen)}
.q{font:500 19px/28px Georgia,"Iowan Old Style","Times New Roman",serif;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;padding:11px 12px;
  border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);cursor:pointer;width:100%}
.opt b{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--pen);color:var(--pen);
  display:grid;place-items:center;font-size:13px;line-height:1}
.opt:hover:not(:disabled){border-color:var(--pen)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.no{background:var(--bad-bg);border-color:var(--bad)}
.opt.no b{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.dim{opacity:.6}
.fb{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--pen-bg);font-size:15px}
.fb strong{display:block;margin-bottom:2px}
.score{font:700 44px/1.1 Georgia,serif;margin:4px 0}
.miss{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.miss li{padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet)}
.miss small{display:block;color:var(--mute);margin-top:4px}
.ans{color:var(--ok);font-weight:600}
.bq{margin:0 0 18px}
.bq p{margin:0 0 6px;font:500 17px/1.45 Georgia,serif}
.bq ol{list-style:upper-alpha;margin:0;padding-left:28px}
.bq li{padding:2px 0}
.bq li.ok{color:var(--ok);font-weight:600}
.bq em{display:block;color:var(--mute);font-size:14px;margin:4px 0 0 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
@media print{.top .btn,.top .link,.row{display:none}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>
<body>
<div class="wrap">
  <h1>PHY 102 Question Bank</h1>
  <p class="sub" id="sub"></p>
  <main id="app"></main>
</div>
<script>
const BANK=[];
function Q(t,q,c,a,b,d,e){BANK.push({t:t,q:q,o:[c,a,b,d],e:e||''});}

/* ---------- FN: Forces in Nature ---------- */
Q("FN","How many fundamental forces of nature are there?","Four","Two","Three","Five");
Q("FN","Which of the four fundamental forces is the weakest?","Gravity","The weak force","Electromagnetic force","The strong nuclear force");
Q("FN","Which of the four fundamental forces is the strongest?","The strong nuclear force","Gravity","Electromagnetic force","The weak force");
Q("FN","Which force is responsible for particle decay, where one type of subatomic particle changes into another?","The weak force","The strong nuclear force","Gravity","Electromagnetic force");
Q("FN","Which force holds the quarks together inside protons and neutrons?","The strong nuclear force","The weak force","Gravity","The magnetic force");
Q("FN","The force that stops a book from falling through a table is a consequence of which fundamental force?","Electromagnetic force","Gravity","The weak force","The strong nuclear force","Electrons in the table's atoms repel electrons in the book's atoms.");
Q("FN","The electromagnetic force consists of which two parts?","The electric force and the magnetic force","The weak force and the strong force","The gravitational force and the electric force","The magnetic force and the nuclear force");
Q("FN","Who is credited with first proposing the idea of gravity as an attraction between two objects?","Isaac Newton","Charles Coulomb","Hendrik Lorentz","Andre-Marie Ampere");
Q("FN","Which of the following is NOT one of the four fundamental forces?","Frictional force","Gravity","The weak force","The strong nuclear force","Friction is a consequence of the electromagnetic force.");
Q("FN","Friction, elasticity and the normal force all arise from which fundamental force?","Electromagnetic force","Gravity","The weak force","The strong nuclear force");
Q("FN","Gravity is an attraction between two objects that have:","Mass or energy","Only positive charge","Only negative charge","Only magnetic poles");
Q("FN","According to the electromagnetic force, which statement about charges is correct?","Opposite charges attract and like charges repel","Like charges attract and opposite charges repel","All charges attract one another","All charges repel one another");
Q("FN","Which component of the electromagnetic force acts on charged particles whether they are moving or stationary?","The electric force","The magnetic force","The weak force","The strong force");
Q("FN","The magnetic component of the electromagnetic force appears when charged particles are:","In motion","At rest","Electrically neutral","Frozen at absolute zero");
Q("FN","The weak force is also called the:","Weak nuclear interaction","Gravitational interaction","Coulomb interaction","Strong nuclear interaction");

/* ---------- ES: Electrostatics and charging ---------- */
Q("ES","Electrostatics is the study of electromagnetic phenomena that occur when there are:","No moving charges","Only moving charges","Only changing magnetic fields","Only alternating currents");
Q("ES","Static electricity is an imbalance of electric charges:","Within or on the surface of a material","Only inside the nucleus of an atom","Only in a flowing current","Only in a vacuum");
Q("ES","A static charge is created whenever two surfaces contact and separate, and at least one of the surfaces is:","An insulator","A conductor","A superconductor","A magnet");
Q("ES","When two insulators are rubbed together, the object that loses electrons becomes:","Positively charged","Negatively charged","Neutral","Magnetised");
Q("ES","The SI unit of electric charge is the:","Coulomb","Ampere","Volt","Farad");
Q("ES","Which symbol is often used to denote electric charge?","Q","R","I","F");
Q("ES","An object is negatively charged if it has:","An excess of electrons","A deficiency of electrons","An excess of protons","An excess of neutrons");
Q("ES","Atoms are normally electrically neutral because they contain:","Equal numbers of positive and negative charges","Only neutrons","No electrons","More protons than electrons");
Q("ES","The three main methods of charging an object are:","Friction, conduction (contact) and induction","Friction, convection and radiation","Conduction, convection and radiation","Induction, magnetisation and ionisation");
Q("ES","Charging by friction is the transfer of which particles from one object to another?","Electrons","Protons","Neutrons","Nuclei");
Q("ES","In charging by conduction (contact), a charged object touches a neutral object. The neutral object then:","Gains the same type of charge as the charged object","Gains the opposite type of charge","Stays neutral","Becomes magnetised");
Q("ES","In charging by induction, the charged object is:","Brought near, but does not touch, the neutral object","Rubbed against the neutral object","Touched to the neutral object","Heated beside the neutral object");
Q("ES","A neutral metal rod is brought close to a negatively charged rod without touching. The end of the metal rod nearer the charged rod becomes:","Positively charged","Negatively charged","Neutral","Magnetised");
Q("ES","A neutral metal sphere is brought near a negatively charged rod, the sphere is grounded, and then the rod is removed. The sphere is left:","Positively charged","Negatively charged","Neutral","Unchanged and polarised");
Q("ES","Which of the following is an everyday example of charge transfer by discharge between a cloud and the ground?","Lightning","A compass needle turning","A rainbow","Thunder echoing");
Q("ES","Which of the following is an application of static electricity?","Photocopiers (xerography)","Steam turbines","Filament bulbs","Nuclear reactors");
Q("ES","The crackling sound heard when very dry hair is combed with a vulcanite comb is caused by:","Small electric sparks","Magnetic attraction","Heating of the comb","Sound waves from the hair");
Q("ES","Electrification by friction is most noticeable when the surrounding air is:","Dry","Humid","Wet","Saturated with water vapour");
Q("ES","A plastic pen rubbed on a coat sleeve will afterwards attract:","Dust and small pieces of paper","Only iron filings","Nothing at all","Only water droplets");
Q("ES","Static electricity is named in contrast with:","Current electricity","Solar electricity","Nuclear energy","Thermal energy");
Q("ES","When two objects are rubbed together, they acquire charges that are:","Equal and opposite","Equal and of the same sign","Unequal and opposite","Always zero");
Q("ES","The magnitude of the charge on one electron is approximately:","1.6 × 10⁻¹⁹ C","1.6 × 10⁻⁹ C","9 × 10⁹ C","8.85 × 10⁻¹² C");
Q("ES","Electric charge is a physical property of matter that causes it to:","Experience a force when near other charged matter","Emit light","Lose mass","Float in air");
Q("ES","Charged matter is influenced by, and produces:","Electromagnetic fields","Gravitational waves only","Sound waves","Nuclear decay");

/* ---------- CL: Coulomb's law ---------- */
Q("CL","Coulomb studied the force between electrically charged bodies in which year?","1785","1687","1831","1905");
Q("CL","According to Coulomb's law, the force between two point charges is directly proportional to:","The product of the charges","The sum of the charges","The square of the distance","The distance between them");
Q("CL","According to Coulomb's law, the force between two point charges is inversely proportional to:","The square of the distance between them","The distance between them","The product of the charges","The sum of the charges");
Q("CL","Coulomb's law is also known as the:","Inverse square law","Direct proportion law","Conservation law","Superposition principle only");
Q("CL","The value of the constant k in Coulomb's law is approximately:","9 × 10⁹ N m² C⁻²","9 × 10⁻⁹ N m² C⁻²","8.85 × 10⁻¹² N m² C⁻²","1.6 × 10⁻¹⁹ N m² C⁻²");
Q("CL","In terms of the permittivity of free space, the constant k is written as:","1/(4πε₀)","4πε₀","ε₀/4π","4π/ε₀");
Q("CL","The permittivity of free space, ε₀, has a value of approximately:","8.854 × 10⁻¹² F/m","8.854 × 10¹² F/m","9 × 10⁹ F/m","1.6 × 10⁻¹⁹ F/m");
Q("CL","For Coulomb's law to apply directly, the charges must be:","Small compared with the distance between them (point charges)","Very large compared with the distance between them","Always equal in magnitude","Always of the same sign");
Q("CL","If the distance between two point charges is doubled, the force between them becomes:","One quarter","One half","Double","Four times");
Q("CL","If the distance between two point charges is halved, the force between them becomes:","Four times","Double","One half","One quarter");
Q("CL","If the distance between two point charges is tripled, the force between them becomes:","One ninth","One third","Three times","Nine times");
Q("CL","If both charges are doubled and the distance stays the same, the force becomes:","Four times","Double","Half","Unchanged");
Q("CL","What happens to the force between two charges if only one of the charges is doubled?","It doubles","It quadruples","It halves","It stays the same");
Q("CL","Two charges of +12 μC and +8 μC are 10 cm apart in a vacuum. The force between them is:","86.4 N","8.64 N","864 N","0.864 N","F = kQ₁Q₂/r² = (9×10⁹)(12×10⁻⁶)(8×10⁻⁶)/(0.1)² = 86.4 N (repulsive).");
Q("CL","Two charges of +2 μC and +5 μC are placed 10 cm apart. The force between them is:","9 N","90 N","0.9 N","18 N","F = (9×10⁹)(2×10⁻⁶)(5×10⁻⁶)/(0.1)² = 9 N.");
Q("CL","Two 1 μC charges are 1 m apart in a vacuum. The force between them is:","9 × 10⁻³ N","9 × 10⁻⁶ N","9 N","9 × 10³ N");
Q("CL","Two charges of +3 μC each are 30 cm apart. The force between them is:","0.9 N","9 N","0.09 N","2.7 N","F = (9×10⁹)(3×10⁻⁶)²/(0.3)² = 0.9 N.");
Q("CL","A charge of +4 μC and a charge of −5 μC are 20 cm apart. The force between them is:","4.5 N, attractive","4.5 N, repulsive","0.45 N, attractive","45 N, attractive");
Q("CL","Three small charges A (+2×10⁻⁸ C), B (−5×10⁻⁸ C) and P (+1×10⁻⁸ C) lie in a line with A–B = 6 cm and B–P = 4 cm. What is the force on P due to A alone?","1.8 × 10⁻⁴ N (repulsive)","1.8 × 10⁻³ N (repulsive)","2.8 × 10⁻³ N (repulsive)","1.8 × 10⁻⁴ N (attractive)","A–P = 10 cm = 0.1 m, so F = (9×10⁹)(2×10⁻⁸)(1×10⁻⁸)/(0.1)² = 1.8 × 10⁻⁴ N.");
Q("CL","For the same arrangement (A = +2×10⁻⁸ C, B = −5×10⁻⁸ C, P = +1×10⁻⁸ C, B–P = 4 cm), the force on P due to B is:","2.8 × 10⁻³ N (attractive)","2.8 × 10⁻³ N (repulsive)","1.8 × 10⁻⁴ N (attractive)","4.5 × 10⁻³ N (attractive)","F = (9×10⁹)(5×10⁻⁸)(1×10⁻⁸)/(0.04)² ≈ 2.8 × 10⁻³ N.");
Q("CL","For the same arrangement, the resultant force on P is approximately:","2.62 × 10⁻³ N towards B","2.98 × 10⁻³ N towards B","2.62 × 10⁻³ N away from B","1.8 × 10⁻⁴ N towards B","2.8 × 10⁻³ − 1.8 × 10⁻⁴ = 2.62 × 10⁻³ N; B attracts P more strongly than A repels it.");
Q("CL","Two identical charges 3 m apart repel each other with a force of 10 N. If the separation is increased to 6 m, the force is:","2.5 N","5 N","20 N","40 N");
Q("CL","By what factor must the separation of two charges be increased to reduce the force between them to one-sixteenth of its value?","4","16","2","8");
Q("CL","Two charges of +4 nC and +6 nC are 3 cm apart. The force between them is approximately:","2.4 × 10⁻⁴ N","2.4 × 10⁻⁶ N","2.4 × 10⁻² N","7.2 × 10⁻⁴ N");
Q("CL","The net force on a charge due to several other charges is found using:","Vector addition (the superposition principle)","Scalar addition of magnitudes only","Multiplying the individual forces","Averaging the individual forces");
Q("CL","Coulomb's law is similar in form to Newton's law of gravitation because both:","Vary as the inverse square of the distance","Are always attractive","Depend on the sum of the sources","Are independent of distance");
Q("CL","12 μC expressed in coulombs is:","1.2 × 10⁻⁵ C","1.2 × 10⁻⁷ C","1.2 × 10⁻³ C","1.2 × 10⁻⁹ C");
Q("CL","10 nC expressed in coulombs is:","1 × 10⁻⁸ C","1 × 10⁻⁶ C","1 × 10⁻¹⁰ C","1 × 10⁻³ C");

/* ---------- EF: Electric field ---------- */
Q("EF","An electric field can be defined as:","A region where an electric force is experienced","A region where only heat is produced","A path through which current flows","A region with no charges");
Q("EF","The electric field intensity E at a point is defined as:","The force per unit charge at that point","The charge per unit force","The work done per unit charge","The charge per unit area");
Q("EF","The relationship between electric field E, force F and charge Q is:","E = F/Q","E = FQ","E = Q/F","E = F/Q²");
Q("EF","The unit of electric field intensity is:","N/C (or V/m)","C/N","N m","J/C only");
Q("EF","Electric field intensity is:","A vector quantity","A scalar quantity","Dimensionless","Always positive");
Q("EF","The direction of the electric field at a point is the direction of the force on:","A positive charge","A negative charge","A neutral particle","A moving electron only");
Q("EF","The force on a charge q placed in an electric field E is:","F = qE","F = q/E","F = E/q","F = qE²");
Q("EF","The electric field intensity due to a point charge Q at distance r is:","Q/(4πε₀r²)","Q/(4πε₀r)","Qr²/(4πε₀)","Q²/(4πε₀r²)");
Q("EF","What is the magnitude of the electric field 3 m from a point charge of 5 nC?","5 N/C","15 N/C","45 N/C","1.7 N/C","E = (9×10⁹)(5×10⁻⁹)/3² = 5 N/C.");
Q("EF","What is the electric field 1 m from a point charge of 1 nC?","9 N/C","9 × 10⁻⁹ N/C","1 N/C","90 N/C");
Q("EF","What is the electric field 2 m from a point charge of 8 nC?","18 N/C","36 N/C","72 N/C","9 N/C","E = (9×10⁹)(8×10⁻⁹)/4 = 18 N/C.");
Q("EF","If the distance from a point charge is doubled, the electric field strength becomes:","One quarter","One half","Double","Four times");
Q("EF","Arrows on electric lines of force show the direction of the force on:","A positive charge","A negative charge","An uncharged body","A magnet");
Q("EF","The force on a negative charge in an electric field is:","In the opposite direction to the field","In the same direction as the field","Perpendicular to the field","Always zero");
Q("EF","When adding two or more electric fields at a point, you must:","Add them as vectors","Add only their magnitudes","Multiply them","Subtract the smaller from the larger always");
Q("EF","A 2 μC charge is placed in a field of 500 N/C. The force on it is:","1 × 10⁻³ N","1 × 10⁻⁶ N","2.5 × 10⁸ N","250 N");
Q("EF","A force of 8 × 10⁻³ N acts on a 4 μC charge. The electric field at that point is:","2000 N/C","2 × 10⁻⁹ N/C","32 N/C","500 N/C");
Q("EF","A particle of charge q and mass m in an electric field E has an acceleration of:","qE/m","mE/q","qm/E","E/(qm)");
Q("EF","The force on an electron in an electric field of 1 × 10⁴ N/C is approximately:","1.6 × 10⁻¹⁵ N","1.6 × 10⁻²³ N","1.6 × 10⁻⁷ N","6.25 × 10²² N");
Q("EF","A proton (m ≈ 1.67 × 10⁻²⁷ kg) is placed in a field of 1000 N/C. Its acceleration is approximately:","9.6 × 10¹⁰ m/s²","9.6 × 10⁷ m/s²","1.6 × 10⁻¹⁶ m/s²","6 × 10¹⁵ m/s²");
Q("EF","Electric field lines start on positive charges and end on:","Negative charges","Positive charges","Neutral atoms","Magnetic poles");
Q("EF","Where electric field lines are closer together, the field is:","Stronger","Weaker","Zero","Uniform");

/* ---------- EP: Electric potential ---------- */
Q("EP","Electric potential is a:","Scalar quantity","Vector quantity","Tensor quantity that has direction","Unit of charge");
Q("EP","Electric potential at a point is defined as:","The work done per unit charge in bringing a positive test charge from a reference point to that point","The force per unit charge at that point","The charge per unit area of a conductor","The rate of flow of charge");
Q("EP","The unit of electric potential is the:","Volt (joule per coulomb)","Newton per coulomb","Farad","Ampere");
Q("EP","The reference point for electric potential is usually taken as:","Infinity","The surface of the Earth only","The positive terminal","The centre of the charge");
Q("EP","The relationship between potential V, work done W and charge Q is:","V = W/Q","V = WQ","V = Q/W","V = W/Q²");
Q("EP","The electric potential due to a point charge Q at distance r (relative to infinity) is:","V = Q/(4πε₀r)","V = Q/(4πε₀r²)","V = Qr/(4πε₀)","V = 4πε₀Q/r");
Q("EP","The expression V = Q/(4πε₀r) is known as the:","Coulomb potential","Ampere potential","Lorentz potential","Gauss potential");
Q("EP","The electric potential due to a system of point charges is:","The sum of the individual potentials","The product of the individual potentials","The vector sum of the individual potentials","Equal to the largest individual potential");
Q("EP","What is the potential at 3 m from a point charge of 5 nC?","15 V","5 V","45 V","1.7 V","V = (9×10⁹)(5×10⁻⁹)/3 = 15 V.");
Q("EP","What is the potential at 0.5 m from a point charge of 2 nC?","36 V","18 V","72 V","9 V");
Q("EP","What is the potential at 0.9 m from a point charge of 3 nC?","30 V","27 V","90 V","3 V");
Q("EP","How much work is done moving a 2 C charge through a potential difference of 12 V?","24 J","6 J","14 J","0.17 J");
Q("EP","A 5 μC charge is placed at a point where the potential is 200 V. Its electric potential energy is:","1 × 10⁻³ J","4 × 10⁷ J","1 × 10⁻⁶ J","40 J");
Q("EP","If the distance from a point charge is doubled, the electric potential becomes:","Half","One quarter","Double","Four times");
Q("EP","Electric potential is often referred to as:","Voltage","Current","Resistance","Capacitance");
Q("EP","The potential of a negative point charge, relative to infinity, is:","Negative","Positive","Zero everywhere","Infinite");
Q("EP","1 volt is equivalent to:","1 joule per coulomb","1 coulomb per joule","1 newton per metre","1 watt per second");

/* ---------- CA: Capacitors ---------- */
Q("CA","A capacitor is a device for:","Storing electric charge","Producing electric current","Increasing resistance","Measuring voltage");
Q("CA","A basic capacitor consists of:","Two parallel metal plates separated by a dielectric","Two coils of wire","A single metal plate","A wire wound on an iron core");
Q("CA","The insulator between the plates of a capacitor is called the:","Dielectric","Electrolyte","Conductor","Terminal");
Q("CA","Which of the following can be used as a dielectric?","Paper, wax, ceramics, mica or air","Copper and silver","Iron and steel","Aluminium and gold");
Q("CA","Charging a capacitor from a battery continues until the potential difference across the capacitor equals:","The e.m.f. of the battery","Zero","Twice the e.m.f. of the battery","The resistance of the circuit");
Q("CA","During charging, the charging current falls to zero when:","The p.d. across the capacitor equals the battery voltage","The battery is disconnected","The plates touch","The capacitor is short-circuited");
Q("CA","The capacitance of a capacitor is defined by:","C = Q/V","C = QV","C = V/Q","C = Q/V²");
Q("CA","The SI unit of capacitance is the:","Farad","Henry","Coulomb","Ohm");
Q("CA","One farad is the capacitance of a capacitor that stores:","One coulomb of charge when the p.d. across it is one volt","One joule of energy at one ampere","One volt at one coulomb per second","One coulomb at one ampere");
Q("CA","1 μF is equal to:","1 × 10⁻⁶ F","1 × 10⁻⁹ F","1 × 10⁻¹² F","1 × 10⁻³ F");

Q("PW","The commercial unit of electrical energy is the:","Kilowatt-hour (kWh)","Kilowatt","Watt-second per hour squared","Joule per second");
Q("PW","1 kWh is equal to:","3.6 × 10⁶ J","3.6 × 10³ J","1 × 10³ J","3.6 × 10⁹ J","1000 W × 3600 s = 3,600,000 J.");
Q("PW","Electricity customers are charged according to their consumption of:","Energy (kWh)","Voltage only","Power rating only","Current only");
Q("PW","The total energy used by an appliance is its power consumption multiplied by:","The time it is on","Its resistance","Its mass","Its voltage rating only");
Q("PW","A current of 0.9 A is maintained in a 160 Ω resistor. The power dissipated is:","129.6 W","144 W","1.4 W","177.8 W","P = I²R = (0.9)²(160) = 129.6 W.");
Q("PW","A current of 0.9 A is maintained in a 160 Ω resistor for 3 hours. The heat energy developed is approximately:","1.4 × 10⁶ J","1.3 × 10⁴ J","4.7 × 10² J","3.9 × 10⁴ J","E = Pt = 129.6 × (3 × 3600) ≈ 1.4 × 10⁶ J.");
Q("PW","An electric fan draws 2.0 A from a 220 V source. Its power rating is:","440 W","110 W","220 W","0.009 W");
Q("PW","An electric fan draws 2.0 A from a 220 V source. Its electrical resistance is:","110 Ω","440 Ω","0.009 Ω","11 Ω","R = V/I = 220/2 = 110 Ω.");
Q("PW","An electric fan rated 440 W operates continuously for 30 days. The energy used is approximately:","316.8 kWh","13.2 kWh","440 kWh","31.7 kWh","E = 0.44 kW × (30 × 24 h) = 316.8 kWh.");
Q("PW","If the fan uses 316.8 kWh and electricity costs a hypothetical ₦10 per kWh, the cost is approximately:","₦3,168","₦316.80","₦31,680","₦31.68");
Q("PW","A 100 W bulb is used for 10 hours. The energy consumed is:","1 kWh","10 kWh","0.1 kWh","100 kWh");
Q("PW","A 2 kW heater runs for 3 hours. The energy consumed is:","6 kWh","0.67 kWh","5 kWh","1.5 kWh");
Q("PW","A 60 W bulb operates on a 240 V supply. The current drawn is:","0.25 A","4 A","14 400 A","0.5 A");
Q("PW","The power dissipated in a 10 Ω resistor carrying 3 A is:","90 W","30 W","33 W","0.9 W");
Q("PW","A device operating at 12 V and 2 A has a power of:","24 W","6 W","10 W","14 W");

/* ---------- KL: Kirchhoff's laws ---------- */
Q("KL","Kirchhoff's laws are used to find:","The currents flowing in different parts of a network","The mass of a conductor","The charge of an electron","The permittivity of free space");
Q("KL","Kirchhoff's first law states that the algebraic sum of the currents entering a point in a circuit is:","Zero","Equal to the battery voltage","Equal to the total resistance","Infinite");
Q("KL","Kirchhoff's first law is written as:","ΣI = 0","ΣV = I","ΣR = 0","ΣQ = V");
Q("KL","Kirchhoff's first law follows from the conservation of:","Charge","Energy","Momentum","Mass");
Q("KL","Kirchhoff's second law follows from the conservation of:","Energy","Charge","Momentum","Mass");
Q("KL","Kirchhoff's second law states that around a closed loop, the algebraic sum of the e.m.f.s is equal to:","The algebraic sum of the products of current and resistance","The total current","The total power only","Zero always");
Q("KL","In applying Kirchhoff's first law, a current is taken as positive if it:","Flows into the point","Flows out of the point","Is alternating","Is less than 1 A");
Q("KL","Currents of 5 A and 3 A flow into a junction and one wire carries current away. The current in that wire is:","8 A","2 A","15 A","1.67 A");
Q("KL","A current of 10 A flows into a junction and splits into two wires. If one carries 4 A, the other carries:","6 A","14 A","40 A","2.5 A");
Q("KL","A 12 V battery is connected in series with 2 Ω and 4 Ω resistors. Using Kirchhoff's second law, the current is:","2 A","1 A","6 A","0.5 A");

/* ---------- LF: Lorentz force and charges in fields ---------- */
Q("LF","The Lorentz force is the:","Total force on a charged particle in electric and magnetic fields","Force between two masses","Force on a neutral particle in a magnetic field","Force between two magnets only");
Q("LF","The Lorentz force is named after the Dutch physicist:","Hendrik Lorentz","Charles Coulomb","Andre-Marie Ampere","Jean-Baptiste Biot");
Q("LF","The Lorentz force on a charge q moving with velocity v in fields E and B is:","F = q(E + v × B)","F = q(E − v × B)","F = qE × vB","F = q/(E + vB)");
Q("LF","The Lorentz force is a:","Vector quantity","Scalar quantity","Dimensionless number","Unit of charge");
Q("LF","When only an electric field is present, the force on a charge is:","F = qE","F = qvB","F = qv/E","F = 0");
Q("LF","The electric force qE acts on:","Both moving and stationary charges","Only moving charges","Only stationary charges","Only neutral particles");
Q("LF","The magnetic force on a charge acts only when the charge is:","Moving (with a component of velocity perpendicular to B)","At rest","Neutral","Moving parallel to B");
Q("LF","The magnitude of the magnetic force on a moving charge is:","F = qvB sinθ","F = qvB cosθ","F = qv/B","F = qB/v");
Q("LF","In F = qvB sinθ, the angle θ is the angle between:","The velocity and the magnetic field","The force and the velocity","The charge and the field","The electric and magnetic fields");
Q("LF","If a charged particle moves perpendicular to a magnetic field, the force magnitude is:","F = qvB","F = 0","F = qv/B","F = qvB/2");
Q("LF","If a charged particle moves parallel to a magnetic field, the magnetic force is:","Zero","Maximum","qvB","Infinite");
Q("LF","The SI unit of magnetic flux density B is the:","Tesla","Weber","Henry","Farad");
Q("LF","The direction of the magnetic force on a moving charge is:","Perpendicular to both v and B","Parallel to v","Parallel to B","Always along the electric field");
Q("LF","In the right-hand rule for F = q(v × B), the thumb points in the direction of:","The force","The velocity","The magnetic field","The current in the wire");
Q("LF","In Fleming's left-hand rule, the thumb represents the direction of:","Motion (force)","The magnetic field","The current","The charge");
Q("LF","In Fleming's left-hand rule, the first finger represents the direction of:","The magnetic field","The force","The current","The velocity of the field");
Q("LF","The symbol × in v × B denotes:","The vector (cross) product","Ordinary multiplication only","Division","The scalar (dot) product");
Q("LF","The magnitude of the vector product v × B is:","vB sinθ","vB cosθ","v/B","vB tanθ");
Q("LF","A proton moves at 3.0 × 10⁷ m/s perpendicular to a uniform magnetic field of 2.5 T. The force on it is (e = 1.6 × 10⁻¹⁹ C):","1.2 × 10⁻¹¹ N","1.2 × 10⁻¹⁹ N","4.8 × 10⁻¹² N","1.2 × 10⁻³ N","F = qvB sin90° = (1.6×10⁻¹⁹)(3.0×10⁷)(2.5) = 1.2 × 10⁻¹¹ N.");
Q("LF","An electron moves at 2 × 10⁶ m/s perpendicular to a magnetic field of 0.5 T. The force on it is:","1.6 × 10⁻¹³ N","3.2 × 10⁻¹³ N","1.6 × 10⁻¹⁹ N","6.4 × 10⁻²⁶ N");
Q("LF","A charge of 2 μC moves at 100 m/s at 30° to a magnetic field of 0.3 T. The force on it is:","3 × 10⁻⁵ N","6 × 10⁻⁵ N","5.2 × 10⁻⁵ N","1.5 × 10⁻⁵ N","F = (2×10⁻⁶)(100)(0.3)(sin30°) = 3 × 10⁻⁵ N.");
Q("LF","The magnetic force on a moving charge does no work because it is:","Always perpendicular to the velocity","Always parallel to the velocity","Zero for all charges","Always in the direction of the field");
Q("LF","A charged particle moving perpendicular to a uniform magnetic field follows:","A circular path","A straight line","A parabola","A spiral outward forever");
Q("LF","Compared with a positive charge, a negative charge with the same velocity in the same magnetic field experiences a magnetic force that is:","In the opposite direction","In the same direction","Zero","Larger in magnitude");
Q("LF","When a particle of charge q is accelerated through a p.d. V, the energy gained is:","E = qV","E = q/V","E = V/q","E = qV²");
Q("LF","When an electron is accelerated through a p.d. of one volt, the energy gained is:","1 electron-volt (1 eV)","1 joule","1 watt","1 kWh");
Q("LF","One electron-volt is equal to approximately:","1.6 × 10⁻¹⁹ J","1.6 × 10⁻¹⁴ J","1 J","9 × 10⁹ J");
Q("LF","An electron is accelerated through a p.d. of 100 V. The energy gained is:","100 eV (1.6 × 10⁻¹⁷ J)","1 eV","1.6 × 10⁻¹⁹ J","10 eV");
Q("LF","The acceleration of a charged particle of mass m in an electric field E is a = qE/m. This follows from:","F = ma and F = qE","F = qvB and F = ma","F = kQ₁Q₂/r² and F = ma","V = IR and F = ma");
Q("LF","A moving charge in an electric field and a magnetic field experiences a force that combines both. This combined expression is used when:","Both electric and magnetic fields are present","Only a gravitational field is present","Only a magnetic field is present","The charge is stationary and no fields exist");

/* ---------- BS: Biot-Savart and Ampere ---------- */
Q("BS","The Biot–Savart law describes the magnetic field:","Generated by a small segment of a current-carrying wire","Of a permanent magnet only","Due to a stationary charge","Inside a capacitor");
Q("BS","The Biot–Savart law for magnetic fields is analogous to which law for electric fields?","Coulomb's law","Ohm's law","Faraday's law","Lenz's law");
Q("BS","The Biot–Savart law gives the magnetic field dB at a point due to a small segment dl as:","dB = μ₀I dl sinθ/(4πr²)","dB = μ₀I dl sinθ/(4πr)","dB = μ₀ dl/(4πIr²)","dB = 4πr²/(μ₀I dl sinθ)");
Q("BS","In the Biot–Savart law, μ₀ is the:","Permeability of free space","Permittivity of free space","Resistivity of free space","Conductivity of free space");
Q("BS","The value of μ₀ is:","4π × 10⁻⁷ T m/A","4π × 10⁷ T m/A","8.85 × 10⁻¹² T m/A","9 × 10⁹ T m/A");
Q("BS","The magnetic field from a small current element varies with the distance r as:","1/r²","1/r","r²","r");
Q("BS","In the Biot–Savart law, θ is the angle between:","The current element dl and the displacement vector r","The wire and the ground","The current and the voltage","The field and the resistor");
Q("BS","The magnetic field contribution dB from a current element is greatest when θ equals:","90°","0°","45°","180°");
Q("BS","The magnetic field contribution dB from a current element is zero when θ equals:","0°","90°","45°","60°");
Q("BS","In applying the Biot–Savart law to a circular loop, the angle θ between dl and r is:","90° for all elements","0° for all elements","45° for all elements","Varying around the loop");
Q("BS","For a circular coil of N turns and radius r, the total length of wire around which dl is integrated is:","2πrN","πr²N","2πr/N","4πrN");
Q("BS","The magnetic field at the centre of a circular coil with N turns, radius r and current I is:","B = μ₀NI/(2r)","B = μ₀NI/(2πr)","B = μ₀NI r/2","B = μ₀I/(2πrN)");
Q("BS","Which statement about the magnetic field near a long straight current-carrying wire is correct?","It is inversely proportional to the distance from the wire","It is directly proportional to the distance from the wire","It is independent of the distance","It is inversely proportional to the square of the distance");
Q("BS","The magnetic field at a distance r from a long straight wire carrying current I is:","B = μ₀I/(2πr)","B = μ₀I/(2πr²)","B = μ₀I/(4πr)","B = 2πrμ₀/I");
Q("BS","If the distance from a long straight current-carrying wire is doubled, the magnetic field becomes:","Half","One quarter","Double","Unchanged");
Q("BS","If the current in a long straight wire is doubled at a fixed distance, the magnetic field becomes:","Double","Half","One quarter","Unchanged");
Q("BS","Ampere's law relates the magnetic field around a closed loop to:","The electric current passing through the loop","The charge on the loop","The resistance of the loop","The temperature of the loop");
Q("BS","Ampere's law is written mathematically as:","∮B·dl = μ₀I","∮B·dl = I/μ₀","∮B·dl = μ₀/I","∮B·dl = 0 always");
Q("BS","In Ampere's law, the current I is the:","Total current enclosed by the path","Current outside the path","Current in the smallest wire only","Alternating current only");
Q("BS","Ampere's law is one of the four:","Maxwell's equations","Kirchhoff's laws","Newton's laws of motion","Laws of thermodynamics");
Q("BS","Ampere's law is particularly useful for calculating magnetic fields in situations with:","High symmetry","No current","Only permanent magnets","Zero resistance");
Q("BS","Applying Ampere's law to a long straight wire gives B(2πr) equal to:","μ₀I","μ₀I/2π","2πr/μ₀I","μ₀/I");
Q("BS","The magnetic field inside a long solenoid is:","B = μ₀nI","B = μ₀I/(2πr)","B = μ₀NI/(2r)","B = I/(μ₀n)");
Q("BS","In the solenoid formula B = μ₀nI, n is the:","Number of turns per unit length","Total number of turns","Number of layers","Number of poles");
Q("BS","The magnetic field of a toroid at radius r is:","B = μ₀NI/(2πr)","B = μ₀nI","B = μ₀I/(2πr)","B = μ₀NI/(2r)");
Q("BS","In the toroid formula, N is the:","Total number of turns","Number of turns per unit length","Number of poles","Number of layers");
Q("BS","The magnetic field 0.1 m from a long straight wire carrying 5 A is:","1 × 10⁻⁵ T","1 × 10⁻⁷ T","6.3 × 10⁻⁶ T","5 × 10⁻⁶ T","B = μ₀I/(2πr) = (4π×10⁻⁷)(5)/(2π × 0.1) = 1 × 10⁻⁵ T.");
Q("BS","The magnetic field 2 cm from a long straight wire carrying 10 A is:","1 × 10⁻⁴ T","1 × 10⁻⁶ T","2 × 10⁻⁴ T","5 × 10⁻⁵ T");
Q("BS","A circular coil has 10 turns, radius 0.1 m and carries 2 A. The magnetic field at its centre is approximately:","1.26 × 10⁻⁴ T","1.26 × 10⁻⁶ T","6.3 × 10⁻⁵ T","2.5 × 10⁻⁴ T","B = μ₀NI/(2r) = (4π×10⁻⁷)(10)(2)/(0.2) ≈ 1.26 × 10⁻⁴ T.");
Q("BS","A single circular loop of radius 0.05 m carries 1 A. The magnetic field at its centre is approximately:","1.26 × 10⁻⁵ T","1.26 × 10⁻⁷ T","6.3 × 10⁻⁶ T","2.5 × 10⁻⁵ T");
Q("BS","A solenoid has 1000 turns per metre and carries 2 A. The magnetic field inside it is approximately:","2.5 × 10⁻³ T","2.5 × 10⁻⁶ T","1.26 × 10⁻³ T","4 × 10⁻³ T","B = μ₀nI = (4π×10⁻⁷)(1000)(2) ≈ 2.5 × 10⁻³ T.");
Q("BS","The Biot–Savart law can be used to find the total field of a whole conductor by:","Integrating the contributions dB from all current elements","Averaging the currents","Multiplying by the resistance","Subtracting the smallest element");
Q("BS","In the Biot–Savart law for the field at a point P, r represents:","The displacement vector from the current element to P","The resistance of the wire","The radius of the Earth","The resistivity of the wire");
Q("BS","The Biot–Savart law applies to magnetic fields produced by:","Moving charges or electric current","Stationary charges only","Gravitational masses","Insulators");

/* ---------- EX: Extras from the topic list ---------- */
Q("EX","Gauss's law relates the electric flux through a closed surface to:","The net charge enclosed by the surface","The charge outside the surface","The area of the surface only","The resistance of the surface");
Q("EX","Gauss's law states that the total electric flux through a closed surface is:","Q_enclosed/ε₀","Q_enclosed × ε₀","ε₀/Q_enclosed","Zero always");
Q("EX","The net electric flux through a closed surface that encloses no net charge is:","Zero","Positive","Negative","Infinite");
Q("EX","The energy stored in a charged capacitor is:","½CV²","CV²","½C/V²","C/(2V)");
Q("EX","A 10 μF capacitor is charged to 100 V. The energy stored is:","0.05 J","0.5 J","1 J","0.001 J","U = ½CV² = ½(10×10⁻⁶)(100)² = 0.05 J.");
Q("EX","The capacitance of a parallel-plate capacitor with vacuum between plates is:","C = ε₀A/d","C = ε₀d/A","C = Ad/ε₀","C = ε₀/(Ad)");
Q("EX","Two capacitors of 2 μF and 3 μF are connected in parallel. The equivalent capacitance is:","5 μF","1.2 μF","6 μF","0.83 μF");
Q("EX","Two capacitors of 6 μF and 3 μF are connected in series. The equivalent capacitance is:","2 μF","9 μF","4.5 μF","18 μF");
Q("EX","Inserting a dielectric between the plates of a capacitor (charge source disconnected or not) generally:","Increases its capacitance","Decreases its capacitance","Leaves its capacitance unchanged","Reduces it to zero");
Q("EX","The energy density (energy per unit volume) stored in an electric field E in vacuum is:","½ε₀E²","ε₀E²/E","½E/ε₀","ε₀E");
Q("EX","When capacitors are connected in series, the charge on each capacitor is:","The same","Different for each capacitor","Zero","Divided by the number of capacitors");


const T={
  FN:"Forces in Nature", ES:"Electrostatics & Charging", CL:"Coulomb's Law", EF:"Electric Field",
  EP:"Electric Potential", CA:"Capacitors", DP:"Electric Dipole",
  CI:"Conductors, Insulators & Bands", CU:"Current & Drift Velocity", VP:"Voltage, P.D. & EMF",
  RS:"Resistance & Ohm's Law", SP:"Series & Parallel", PW:"Power & Energy", KL:"Kirchhoff's Laws",
  LF:"Lorentz Force", BS:"Biot-Savart & Ampere", EX:"Extras: Gauss & Field Energy"
};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const LET=['A','B','C','D'];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const mk=b=>({b:b,opts:shuf(b.o.map((t,i)=>({t:t,ok:i===0}))),pick:null});
BANK.forEach(b=>{b.fixed=shuf(b.o.map((t,i)=>({t:t,ok:i===0})));});

let sel=new Set(Object.keys(T));
let count=20;
let Z=null;

document.getElementById('sub').textContent=
  BANK.length+' multiple-choice questions across '+Object.keys(T).length+' topics, built from your PHY 102 notes.';

function home(){
  const c={};BANK.forEach(b=>{c[b.t]=(c[b.t]||0)+1;});
  const pool=BANK.filter(b=>sel.has(b.t)).length;
  app.innerHTML=
   '<section class="card"><h2>Topics</h2><div class="chips">'+
   Object.keys(T).map(k=>'<button class="chip'+(sel.has(k)?' on':'')+'" data-k="'+k+'">'+esc(T[k])+'<span>'+(c[k]||0)+'</span></button>').join('')+
   '</div><div class="row" style="margin-top:10px"><button class="link" id="all">Select all</button><button class="link" id="none">Clear</button></div></section>'+
   '<section class="card"><h2>Questions per round</h2><div class="chips">'+
   [10,20,30,50,'All'].map(n=>'<button class="chip'+(String(count)===String(n)?' on':'')+'" data-n="'+n+'">'+n+'</button>').join('')+
   '</div><p class="mute">'+pool+' question'+(pool===1?'':'s')+' in the selected topics. Options are shuffled every time.</p>'+
   '<div class="row"><button class="btn" id="start"'+(pool?'':' disabled')+'>Start practice</button>'+
   '<button class="btn ghost" id="browse"'+(pool?'':' disabled')+'>Browse with answers</button></div></section>';
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);home();});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{count=b.dataset.n==='All'?'All':+b.dataset.n;home();});
  document.getElementById('all').onclick=()=>{sel=new Set(Object.keys(T));home();};
  document.getElementById('none').onclick=()=>{sel=new Set();home();};
  document.getElementById('start').onclick=()=>{
    let p=shuf(BANK.filter(b=>sel.has(b.t)));
    if(count!=='All')p=p.slice(0,count);
    begin(p);
  };
  document.getElementById('browse').onclick=browse;
  window.scrollTo(0,0);
}

function begin(list){Z={qs:list.map(mk),i:0,score:0,done:false};show();}

function show(){
  if(Z.i>=Z.qs.length){return results();}
  const it=Z.qs[Z.i], n=Z.qs.length;
  app.innerHTML=
   '<div class="top"><button class="link" id="quit">Quit to menu</button></div>'+
   '<div class="page"><div class="meta"><span>'+esc(T[it.b.t])+'</span><span>Question '+(Z.i+1)+' of '+n+' · Score '+Z.score+'</span></div>'+
   '<div class="bar"><i style="width:'+Math.round(Z.i/n*100)+'%"></i></div>'+
   '<p class="q">'+esc(it.b.q)+'</p><div class="opts" id="opts">'+
   it.opts.map((o,k)=>'<button class="opt" data-k="'+k+'"><b>'+LET[k]+'</b><span>'+esc(o.t)+'</span></button>').join('')+
   '</div><div id="fb"></div><div class="row" id="nx"></div></div>';
  document.getElementById('quit').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  window.scrollTo(0,0);
}

function pick(k){
  const it=Z.qs[Z.i]; if(it.pick!==null)return;
  it.pick=k;
  const right=it.opts[k].ok; if(right)Z.score++;
  const btns=app.querySelectorAll('.opt');
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(it.opts[j].ok)b.classList.add('ok');
    else if(j===k)b.classList.add('no');
    else b.classList.add('dim');
  });
  const ans=it.opts.findIndex(o=>o.ok);
  document.getElementById('fb').innerHTML='<div class="fb"><strong>'+(right?'Correct.':'Not quite. The answer is '+LET[ans]+'.')+'</strong>'+
    (it.b.e?esc(it.b.e):'')+'</div>';
  const last=Z.i===Z.qs.length-1;
  document.getElementById('nx').innerHTML='<button class="btn" id="next">'+(last?'See results':'Next question')+'</button>';
  const nx=document.getElementById('next');
  nx.onclick=()=>{Z.i++;show();};
  nx.focus({preventScroll:false});
}

function results(){
  const n=Z.qs.length, pct=Math.round(Z.score/n*100);
  const missed=Z.qs.filter(x=>!x.opts[x.pick].ok);
  app.innerHTML=
   '<section class="card"><h2>Round complete</h2><div class="score">'+Z.score+' / '+n+'</div>'+
   '<p class="mute" style="margin-top:0">'+pct+'% correct</p>'+
   '<div class="row"><button class="btn" id="again">New round</button>'+
   (missed.length?'<button class="btn ghost" id="retry">Retry the '+missed.length+' missed</button>':'')+
   '<button class="link" id="home">Back to menu</button></div></section>'+
   (missed.length?'<section class="card"><h2>Review of missed questions</h2><ul class="miss">'+
   missed.map(x=>'<li>'+esc(x.b.q)+'<small>Your answer: '+esc(x.opts[x.pick].t)+'</small><small class="ans">Correct: '+esc(x.b.o[0])+'</small>'+
   (x.b.e?'<small>'+esc(x.b.e)+'</small>':'')+'</li>').join('')+'</ul></section>':'');
  document.getElementById('again').onclick=()=>{
    let p=shuf(BANK.filter(b=>sel.has(b.t)));
    if(count!=='All')p=p.slice(0,count);
    begin(p);
  };
  const r=document.getElementById('retry'); if(r)r.onclick=()=>begin(shuf(missed.map(x=>x.b)));
  document.getElementById('home').onclick=home;
  window.scrollTo(0,0);
}

function browse(){
  let h='<div class="top"><button class="link" id="back">Back to menu</button><button class="link" onclick="window.print()">Print</button></div>';
  Object.keys(T).filter(k=>sel.has(k)).forEach(k=>{
    const list=BANK.filter(b=>b.t===k);
    h+='<h3>'+esc(T[k])+' ('+list.length+')</h3>';
    list.forEach((b,i)=>{
      h+='<div class="bq"><p>'+(i+1)+'. '+esc(b.q)+'</p><ol>'+
        b.fixed.map(o=>'<li'+(o.ok?' class="ok"':'')+'>'+esc(o.t)+(o.ok?' ✓':'')+'</li>').join('')+'</ol>'+
        (b.e?'<em>'+esc(b.e)+'</em>':'')+'</div>';
    });
  });
  app.innerHTML=h;
  document.getElementById('back').onclick=home;
  window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{
  if(!Z||!document.getElementById('opts'))return;
  const k='abcd'.indexOf(e.key.toLowerCase());
  if(k>-1&&e.key.length===1)pick(k);
});

home();
</script>
</body>
</html>
